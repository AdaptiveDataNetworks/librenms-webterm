version: 2

project_name: librenms-webterm-gw

# GoReleaser runs from the REPOSITORY ROOT, not from gateway/. The Go module
# lives in gateway/, so builds.dir points the compiler there while every path
# below stays relative to the root -- LICENSE, README.md and packaging/ are all
# root-level, and GoReleaser refuses ".." in archive paths.
before:
  hooks:
    - sh tools/bundle-installer.sh build/install.sh
    # -C changes directory before running; before.hooks takes plain strings,
    # not a cmd/dir map.
    - go -C gateway mod tidy

builds:
  - id: gateway
    dir: gateway
    main: ./cmd/librenms-webterm-gw
    binary: librenms-webterm-gw
    # Static: the binary must run on a minimal container and on distributions
    # whose glibc is older than the build host's.
    env:
      - CGO_ENABLED=0
    goos: [linux]
    # Only what we actually test. Promising darwin or armv7 without a CI job
    # exercising them means shipping a platform we cannot support.
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    # These paths are relative to the REPOSITORY ROOT. GoReleaser runs from
    # there. There is no `workdir` set -- this comment used to claim there was,
    # which would make every path here wrong by one level; the Go build finds
    # the gateway through its own `dir:` instead.
    # Getting this wrong is invisible until a tag is pushed, because the
    # release workflow never runs in CI. A `goreleaser release --snapshot` in
    # tools/preflight.sh is what catches it now.
    files:
      - LICENSE
      - README.md
      - packaging/systemd/librenms-webterm-gw.service
      # install.sh copies this to /etc/librenms-webterm/gateway.env. Without it
      # the gateway starts with no allowed origins and refuses every browser
      # connection, with no config file for the operator to edit.
      - packaging/systemd/librenms-webterm-gw.env.example
      - packaging/install.sh
      # install.sh sources this from its own directory. Ship one without the
      # other and the tarball install silently skips proxy setup.
      - packaging/webserver.sh
      # install.sh sources this to add the package repository, which is how it
      # installs the gateway by default.
      - packaging/repository.sh

snapshot:
  # A snapshot is built from commits AHEAD of the last tag, so it must sort
  # above it. The default stamps the current tag -- 1.0.9-SNAPSHOT-<sha> --
  # which nfpm renders as 1.0.9~SNAPSHOT-<sha> for deb, and `~` sorts BELOW
  # everything. Now that a package repository exists, that made a dev-channel
  # build look OLDER than the release it is ahead of, so `apt upgrade` would
  # quietly move a tester backwards onto 1.0.9. incpatch gives 1.0.10-SNAPSHOT.
  version_template: '{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}'

checksum:
  name_template: checksums.txt
  algorithm: sha256

# The source tarball must contain the Go sources: GPL-3.0-or-later, and a
# release without them is not a compliant distribution.
source:
  enabled: true

nfpms:
  - id: packages
    package_name: librenms-webterm-gw
    vendor: adn
    homepage: https://github.com/AdaptiveDataNetworks/librenms-webterm
    maintainer: Lee Clements <lee.clements@adaptivedatanetworks.com>
    description: |
      SSH gateway for the LibreNMS WebTerm plugin.
      Terminates browser WebSockets and dials monitored devices.
    license: GPL-3.0-or-later
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/librenms-webterm-gw.service
        dst: /lib/systemd/system/librenms-webterm-gw.service
      - src: packaging/systemd/librenms-webterm-gw.env.example
        dst: /etc/librenms-webterm/gateway.env
        type: config|noreplace
      # Sourced by the maintainer scripts. deb and rpm disagree about the
      # arguments that say "this is an upgrade", and getting that wrong left
      # `dnf upgrade` with a stopped, disabled gateway.
      - src: packaging/scripts/lifecycle.sh
        dst: /usr/share/librenms-webterm/lifecycle.sh
        file_info:
          mode: 0644
      # The end-to-end setup helper. Shipped so an operator who installed the
      # package from the repo can run one command instead of following the
      # install page by hand; install.sh finds webserver.sh via /usr/share.
      - src: packaging/install.sh
        dst: /usr/sbin/librenms-webterm-setup
        file_info:
          mode: 0755
      - src: packaging/webserver.sh
        dst: /usr/share/librenms-webterm/webserver.sh
        file_info:
          mode: 0644
      - src: packaging/repository.sh
        dst: /usr/share/librenms-webterm/repository.sh
        file_info:
          mode: 0644
      - dst: /etc/librenms-webterm
        type: dir
        file_info:
          mode: 0750
    scripts:
      preinstall: packaging/scripts/preinstall.sh
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh

    rpm:
      scripts:
        # %posttrans is the only hook that runs after the OUTGOING package's
        # %preun, and an upgrade from <= 1.0.9 needs exactly that: those
        # releases stopped and disabled the unit with no argument guard.
        # There is no deb equivalent -- postinstall.sh handles that case by
        # version comparison instead.
        posttrans: packaging/scripts/posttrans.sh

dockers:
  - image_templates:
      - ghcr.io/adaptivedatanetworks/librenms-webterm-gw:{{ .Version }}-amd64
    dockerfile: packaging/Dockerfile
    use: buildx
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.source=https://github.com/AdaptiveDataNetworks/librenms-webterm
      - --label=org.opencontainers.image.licenses=GPL-3.0-or-later
  - image_templates:
      - ghcr.io/adaptivedatanetworks/librenms-webterm-gw:{{ .Version }}-arm64
    dockerfile: packaging/Dockerfile
    use: buildx
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.source=https://github.com/AdaptiveDataNetworks/librenms-webterm
      - --label=org.opencontainers.image.licenses=GPL-3.0-or-later

docker_manifests:
  - name_template: ghcr.io/adaptivedatanetworks/librenms-webterm-gw:{{ .Version }}
    image_templates:
      - ghcr.io/adaptivedatanetworks/librenms-webterm-gw:{{ .Version }}-amd64
      - ghcr.io/adaptivedatanetworks/librenms-webterm-gw:{{ .Version }}-arm64

release:
  prerelease: auto

  # The documentation tells operators to download install.sh, read it, then run
  # it. That only works if it is a release asset in its own right -- inside the
  # tarball it is unreachable until after you have already downloaded and
  # trusted the tarball.
  extra_files:
    # The generated single-file installer. packaging/install.sh is NOT published
    # on its own: it sources two sibling modules, and an operator who fetched
    # only the one file got a script that skipped the reverse proxy and could
    # not reach the package repository, while still reporting success.
    - glob: build/install.sh
  footer: |
    ## Verifying this release

    Every artifact is covered by build provenance attestation:

        gh attestation verify librenms-webterm-gw_..._linux_amd64.tar.gz --repo adaptivedatanetworks/librenms-webterm

    ## Installing

        curl -fsSLO https://github.com/AdaptiveDataNetworks/librenms-webterm/releases/latest/download/install.sh
        less install.sh          # read it before you run it
        sh install.sh

    That adds the package repository, installs both halves, configures the
    reverse proxy and verifies the result. Existing installs upgrade with
    `apt upgrade` or `dnf upgrade` once the repository is added.

    Plugin and gateway ship together and must be upgraded together: they support
    exactly one protocol version and a mismatch is refused before the terminal
    opens. Run `./lnms webterm:doctor` after upgrading.
