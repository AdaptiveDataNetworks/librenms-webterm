# packages.adaptivedatanetworks.com
#
# Serves the published repository tree. @ROOT@/public is a SYMLINK that the
# build script swaps atomically, so a client that fetches Release and then
# Packages sees one consistent release or the other -- never half of each.
server {
    listen 80;
    listen [::]:80;
    server_name @HOSTNAME@;

    root @ROOT@/public;
    autoindex on;

    # The symlink IS the publishing mechanism; refusing to follow it serves 404.
    disable_symlinks off;

    # Repository metadata changes on every publish and is small. Packages are
    # immutable once published -- a given filename is never rewritten.
    location ~ ^/deb/dists/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~ ^/rpm/repodata/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~ \.(deb|rpm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # An operator following the install docs fetches this by hand.
    location = /adn-archive-keyring.asc {
        default_type text/plain;
    }

    access_log /var/log/nginx/adn-packages.access.log;
    error_log  /var/log/nginx/adn-packages.error.log;
}
