site_name: LibreNMS WebTerm
site_description: In-browser SSH terminal for LibreNMS, with HashiCorp Vault or encrypted database credentials.
site_url: https://adn.github.io/librenms-webterm/
repo_url: https://github.com/adn/librenms-webterm
repo_name: adn/librenms-webterm
edit_uri: edit/main/docs/
copyright: Licensed GPL-3.0-or-later. Not affiliated with LibreNMS or HashiCorp.

# Fail the build on a bad link or a page missing from nav, rather than shipping
# a site with dead ends. Paired with `mkdocs build --strict` in CI.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  # Self-host fonts: the docs must build and render in air-gapped environments,
  # and we should not leak reader IPs to a third party.
  font: false
  features:
    - content.code.copy
    - content.action.edit
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
  - Installation:
      - LibreNMS updates: install/librenms-updates.md
  - Credentials:
      - HashiCorp Vault: vault/index.md
  - Security:
      - Should you enable this?: security/index.md
  - Architecture:
      - How it works: architecture/index.md
  - Reference:
      - Compatibility: reference/compatibility.md
  - Contributing:
      - Style guide: contributing/style-guide.md
