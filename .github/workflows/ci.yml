name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-guard:
    name: Dependency guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer validate --strict --no-check-lock
      # The single most important job in this repo. See tools/composer-guard.php
      # for why: a stray runtime dependency breaks `lnms plugin:add` for every
      # user and can block their next LibreNMS update.
      - run: php tools/composer-guard.php

  protocol-drift:
    name: Protocol codegen is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      # Needed so the generator can gofmt its Go output.
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: php tools/generate-protocol.php
      - name: Fail if generated files differ from protocol.json
        run: |
          if ! git diff --exit-code -- src/Protocol.php gateway/internal/proto/proto.go; then
            echo "::error::Generated protocol files are stale. Run: php tools/generate-protocol.php"
            exit 1
          fi

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --ansi --no-progress
      - run: vendor/bin/pest --colors=always

  gateway:
    name: Gateway (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: gateway/go.sum
      # `gofmt -l` exits 0 even when it lists unformatted files, so the exit
      # code cannot be used directly -- check that its output is empty.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      # -race needs cgo, which the runner has. Release builds are CGO_ENABLED=0.
      - run: go test -race ./...

      # Two implementations of one specification will drift, and the failure
      # mode is a total outage neither side's unit tests would catch. So the
      # PHP client is exercised against the real binary here.
      - name: Build the gateway for cross-implementation tests
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/librenms-webterm-gw" ./cmd/librenms-webterm-gw

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          working-directory: ${{ github.workspace }}

      - name: Cross-implementation tests (PHP signs, Go verifies)
        working-directory: ${{ github.workspace }}
        env:
          WEBTERM_GATEWAY_BIN: ${{ runner.temp }}/librenms-webterm-gw
        run: |
          output=$(vendor/bin/pest tests/Feature/GatewayClientTest.php --colors=never)
          echo "$output"
          if echo "$output" | grep -q 'skipped'; then
            echo "::error::Cross-implementation tests skipped; they must run here."
            exit 1
          fi

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # A malformed unit fails at `systemctl start`, on the user's machine,
      # after they have already installed it.
      - name: Verify the systemd unit
        run: |
          systemd-analyze verify packaging/systemd/librenms-webterm-gw.service 2>&1 | tee /tmp/unit.log

          # systemd-analyze exits 0 even on warnings, so the output is what
          # matters. The one expected complaint is that ExecStart does not
          # exist -- the binary is not installed on a CI runner -- so that line
          # is filtered and anything else is a real problem.
          grep -v 'is not executable: No such file or directory' /tmp/unit.log > /tmp/unit-real.log || true

          if [ -s /tmp/unit-real.log ]; then
            echo "::error::systemd-analyze reported problems with the unit"
            cat /tmp/unit-real.log
            exit 1
          fi

      - name: Shell scripts must parse
        run: |
          for f in packaging/install.sh packaging/scripts/*.sh; do
            sh -n "$f" || exit 1
          done

      - name: install.sh refuses to run without a pinned version
        run: |
          if sh packaging/install.sh --dry-run 2>/dev/null; then
            echo "::error::install.sh should require --version"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: gateway/go.sum

      - name: GoReleaser config must be valid
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: '~> v2'
          args: check
