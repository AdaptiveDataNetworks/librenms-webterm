name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      # Fast structural check; gives a precise error before the slower build.
      - run: php tools/check-docs.php

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt

      # --strict turns every warning into an error: a broken link, an orphaned
      # page or a nav entry pointing at nothing fails the build rather than
      # shipping a site with dead ends.
      - run: mkdocs build --strict
