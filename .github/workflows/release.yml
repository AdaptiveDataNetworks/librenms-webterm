name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  # Required for build provenance attestation.
  id-token: write
  attestations: write

jobs:
  gateway:
    name: Release the gateway
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved, and a
      # release workflow is exactly where a supply-chain compromise pays off.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: stable
          cache-dependency-path: gateway/go.sum

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - uses: goreleaser/goreleaser-action@286f3b13b1b49da4ac219696163fb8c1c93e1200 # v6.0.0
        with:
          version: '~> v2'
          args: release --clean
          workdir: gateway
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attests that these artifacts were built by this workflow from this
      # commit. Consumers verify with:
      #   gh attestation verify <file> --repo adaptivedatanetworks/librenms-webterm
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: gateway/dist/checksums.txt

  docs:
    name: Publish versioned docs
    runs-on: ubuntu-latest
    # Serialised with the branch deploy so two runs cannot race the gh-pages
    # branch and lose a version.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - run: pip install -r docs/requirements.txt mike

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MINOR="${VERSION%.*}"
          mike deploy --push --update-aliases "$MINOR" latest
          mike set-default --push latest

      - name: Confirm the version actually appeared
        run: |
          git fetch origin gh-pages
          git show origin/gh-pages:versions.json | grep -q "${GITHUB_REF_NAME#v}" \
            || (echo "::error::The new docs version is missing from versions.json"; exit 1)
