name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  # Required for build provenance attestation.
  id-token: write
  attestations: write

jobs:
  gateway:
    name: Release the gateway
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved, and a
      # release workflow is exactly where a supply-chain compromise pays off.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: gateway/go.sum

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser runs from the repository root, so dist/ is at the root too.
      # Assert it before attesting: the release notes tell users to run
      # `gh attestation verify`, and shipping artifacts that fail that check
      # would make the release notes a lie.
      - name: Assert the artifacts exist before attesting
        run: |
          test -f dist/checksums.txt || {
            echo "::error::dist/checksums.txt is missing -- attestation would be skipped silently"
            ls -la dist/ || true
            exit 1
          }
          cat dist/checksums.txt

      # Attests that these artifacts were built by this workflow from this
      # commit. Consumers verify with:
      #   gh attestation verify <file> --repo adaptivedatanetworks/librenms-webterm
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

  docs:
    name: Publish versioned docs
    runs-on: ubuntu-latest
    # Serialised with the branch deploy so two runs cannot race the gh-pages
    # branch and lose a version.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: pip install -r docs/requirements.txt mike

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MINOR="${VERSION%.*}"
          mike deploy --push --update-aliases "$MINOR" latest
          mike set-default --push latest

      - name: Confirm the version actually appeared
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MINOR="${VERSION%.*}"

          git fetch origin gh-pages

          # mike deploys the MINOR series (1.0), not the patch version, so that
          # 1.0.1 supersedes 1.0.0's docs rather than adding a second entry
          # nobody wants to choose between. Check for what was actually
          # deployed -- an earlier version of this check looked for the full
          # version and failed on a deploy that had in fact succeeded.
          if ! git show origin/gh-pages:versions.json | python3 -c "
          import json, sys
          want = sys.argv[1]
          versions = json.load(sys.stdin)
          names = [v.get('version') for v in versions]
          aliases = [a for v in versions for a in v.get('aliases', [])]
          print('deployed versions:', names, 'aliases:', aliases)
          sys.exit(0 if want in names and 'latest' in aliases else 1)
          " "$MINOR"; then
            echo "::error::Docs version $MINOR or the 'latest' alias is missing from versions.json"
            exit 1
          fi
