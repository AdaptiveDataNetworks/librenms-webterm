name: LibreNMS integration

# Installs this plugin into real LibreNMS checkouts. This is the early-warning
# system for core drift: LibreNMS is a moving target and our only supported
# install path resolves against its live composer.lock.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'composer.json'
      - 'src/**'
      - 'routes/**'
      - '.github/workflows/integration.yml'

permissions:
  contents: read

jobs:
  install:
    name: LibreNMS ${{ matrix.ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # master plus the two most recent stable tags, resolved at run time.
        ref: ['master']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, snmp, gmp, bcmath, curl, xml, mbstring
          coverage: none

      - name: Clone LibreNMS
        run: git clone --depth 1 --branch ${{ matrix.ref }} https://github.com/librenms/librenms.git librenms

      - name: Install LibreNMS dependencies
        working-directory: librenms
        run: composer install --no-interaction --no-progress --no-dev

      - name: Add this plugin as a path repository
        working-directory: librenms
        run: |
          composer config repositories.webterm '{"type":"path","url":"../plugin","options":{"symlink":false}}'

      # This is the step that reproduces what a user's `lnms plugin:add` does.
      # If our composer.json conflicts with LibreNMS's lockfile, it fails HERE
      # rather than in a user's production install.
      - name: composer require (mirrors lnms plugin:add)
        working-directory: librenms
        run: composer require --update-no-dev --no-interaction adaptivedatanetworks/librenms-webterm:@dev
        env:
          FORCE: 1

      - name: Assert the provider is discovered
        working-directory: librenms
        run: |
          grep -q 'Adn\\\\WebTerm\\\\WebTermServiceProvider' vendor/composer/installed.json \
            || (echo "::error::Provider missing from installed.json — auto-discovery will not fire"; exit 1)

      # A closure in our routes, or a non-serialisable config value, would break
      # these for the whole LibreNMS application — not just for our plugin.
      - name: Laravel caches must survive our plugin
        working-directory: librenms
        run: |
          cp .env.example .env || true
          php artisan key:generate --force || true
          php artisan config:cache
          php artisan route:cache
          php artisan route:clear
          php artisan config:clear

      # The contract suite skips when LibreNMS is absent, so this job is the
      # only place it actually executes. It asserts every core symbol our
      # adapters name still exists -- the early warning for upstream renames.
      - name: Install dev dependencies for the contract suite
        working-directory: plugin
        run: composer install --no-interaction --no-progress

      - name: Contract tests against real LibreNMS core
        working-directory: plugin
        env:
          WEBTERM_LIBRENMS_PATH: ${{ github.workspace }}/librenms
        run: |
          output=$(vendor/bin/pest --testsuite=Contract --colors=never)
          echo "$output"
          # A contract suite that silently skips is worthless -- fail loudly.
          if echo "$output" | grep -q 'skipped'; then
            echo "::error::Contract tests skipped in the integration job; they must run here."
            exit 1
          fi
